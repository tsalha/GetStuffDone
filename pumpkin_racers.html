<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pumpkin Racers — Live Results</title>
  <style>
    :root{--bg:#0b0f14;--card:#121822;--ink:#e8eef7;--muted:#9bb2cc;--accent:#f59e0b;--ok:#22c55e;--warn:#ef4444}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#0b0f14,#0d131d 40%,#0b0f14);color:var(--ink)}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{font-size:clamp(22px,3.4vw,36px);margin:0;letter-spacing:0.5px}
    .badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:6px 10px;border-radius:999px;border:1px solid #1c2736}
    .row{display:grid;grid-template-columns:1fr;gap:16px}
    @media(min-width:860px){.row{grid-template-columns:1.4fr .9fr}}
    .card{background:var(--card);border:1px solid #1c2736;border-radius:16px;padding:14px 14px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .card h2{margin:2px 0 10px;font-size:18px;letter-spacing:.3px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
    button,select{background:#0e1622;border:1px solid #243244;color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:600}
    button:hover{filter:brightness(1.1);cursor:pointer}
    .grid{display:grid;gap:10px}
    .heats{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .heat{border:1px solid #233044;border-radius:12px;padding:10px;background:#0f1722}
    .heat h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
    .list{display:grid;gap:8px}
    .rowline{display:flex;align-items:center;justify-content:space-between;background:#0e1520;border:1px solid #233044;border-radius:10px;padding:8px 10px}
    .rowline .name{font-weight:700}
    .pill{border-radius:999px;padding:2px 8px;border:1px solid #2a3b50;background:#0b111a;color:var(--muted);font-size:12px}
    .rank1{border-color:#2d4230;background:#0c1510;color:var(--ok)}
    .rank2{border-color:#3e3441;background:#141015;color:#c084fc}
    .rank3{border-color:#42322d;background:#15110c;color:#f97316}
    .rank4{border-color:#422d2d;background:#150c0c;color:var(--warn)}
    .muted{color:var(--muted)}
    .legend{display:flex;gap:8px;flex-wrap:wrap}
    .legend .pill{background:#0c121b}
    footer{opacity:.7;font-size:12px;margin-top:16px;text-align:center}
    a{color:#93c5fd}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎃 Pumpkin Racers — Live Results</h1>
      <div class="badge"><span id="statusDot">●</span><span id="statusText">Connecting…</span></div>
    </header>

    <div class="row">
      <section class="card" id="racesCard">
        <h2>Heats</h2>
        <div class="toolbar">
          <label>Bracket
            <select id="bracketSel">
              <option value="ALL">All</option>
              <option value="W">Winners (W)</option>
              <option value="L">Losers (L)</option>
            </select>
          </label>
          <label>Round
            <select id="roundSel"><option value="ALL">All</option></select>
          </label>
          <button id="refreshBtn" title="Refresh now">Refresh</button>
          <span class="pill" id="lastSync">—</span>
        </div>
        <div class="grid heats" id="heats"></div>
        <div class="legend" style="margin-top:10px">
          <span class="pill rank1">🏁 1st (advances)</span>
          <span class="pill rank2">🥈 2nd (advances)</span>
          <span class="pill rank3">3rd</span>
          <span class="pill rank4">4th</span>
        </div>
      </section>

      <aside class="card">
        <h2>Standings</h2>
        <div class="toolbar">
          <label>Filter
            <select id="standingFilter">
              <option value="ALL">All</option>
              <option value="ACTIVE">Active</option>
              <option value="OUT">Eliminated</option>
            </select>
          </label>
        </div>
        <div class="list" id="standings"></div>
      </aside>
    </div>

    <footer>Auto-refreshing every <span id="pollRate">10</span>s • Powered by Google Sheets</footer>
  </div>

  <script>
    // ====== CONFIG ======
    const SPREADSHEET_ID = "2128493689"; // set your ID
    const SHEETS = { races: "Races", standings: "Standings" };
    const POLL_MS = 10000; // 10s

    // ====== Utilities ======
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const heatsEl = document.getElementById('heats');
    const roundSel = document.getElementById('roundSel');
    const bracketSel = document.getElementById('bracketSel');
    const standingsEl = document.getElementById('standings');
    const standingFilter = document.getElementById('standingFilter');
    const lastSync = document.getElementById('lastSync');

    function setOnline(ok){
      statusDot.style.color = ok ? '#22c55e' : '#ef4444';
      statusText.textContent = ok ? 'Live' : 'Offline';
    }

    function gvizUrl(sheet){
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&tq=${encodeURIComponent('select *')}`;
    }

    async function fetchGviz(sheet){
      const res = await fetch(gvizUrl(sheet), {cache:'no-store'});
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
      const cols = json.table.cols.map(c => c.label || c.id);
      const rows = json.table.rows.map(r => {
        const o = {}; r.c.forEach((cell,i)=>o[cols[i]] = cell ? cell.v : ''); return o;
      });
      return rows;
    }

    function distinct(arr){ return Array.from(new Set(arr)); }

    function renderRoundsSelector(rows){
      const rounds = distinct(rows.map(r=> Number(r.Round||0) || 0)).filter(x=>x>0).sort((a,b)=>a-b);
      roundSel.innerHTML = '<option value="ALL">All</option>' + rounds.map(r=>`<option value="${r}">${r}</option>`).join('');
    }

    function pillForPlace(p){
      const base = 'pill ' + (p==1?'rank1':p==2?'rank2':p==3?'rank3':'rank4');
      const label = p==1?'1st':p==2?'2nd':p==3?'3rd':'4th';
      return `<span class="${base}">${label}</span>`
    }

    function renderHeats(races){
      const selBracket = bracketSel.value;
      const selRound = roundSel.value;
      const filtered = races.filter(r=> (selBracket==='ALL'||r.Bracket===selBracket) && (selRound==='ALL'|| String(r.Round)===String(selRound)));
      heatsEl.innerHTML = filtered.map(r=>{
        const lanes = [r.Lane1,r.Lane2,r.Lane3,r.Lane4].filter(x=>x!=='');
        const places = [r.Place1,r.Place2,r.Place3,r.Place4].map(x=>x||'');
        const rows = lanes.map((name,i)=>{
          const plc = places[i];
          const badge = plc ? pillForPlace(i+1) : '<span class="pill muted">—</span>';
          return `<div class="rowline"><span class="name">${name}</span>${badge}</div>`
        }).join('');
        return `<div class="heat">
          <h3>Round ${r.Round} • ${r.Bracket==='W'?'Winners':'Losers'} • Heat ${r.Heat}</h3>
          <div class="list">${rows || '<div class="muted">No racers assigned</div>'}</div>
        </div>`
      }).join('') || '<div class="muted">No heats to show yet.</div>';
    }

    function renderStandings(stand){
      const mode = standingFilter.value;
      const rows = stand
        .filter(s => mode==='ALL' || (mode==='ACTIVE' ? String(s.Active).toLowerCase()==='true' : String(s.Active).toLowerCase()!=='true'))
        .sort((a,b)=> (String(b.Active).toLowerCase()==='true') - (String(a.Active).toLowerCase()==='true') || (a.Losses-b.Losses) || a.Name.localeCompare(b.Name));
      standingsEl.innerHTML = rows.map(s=>{
        const tag = String(s.Active).toLowerCase()==='true' ? '<span class="pill rank1">ACTIVE</span>' : '<span class="pill rank4">OUT</span>';
        return `<div class="rowline"><span class="name">${s.Name}</span><span class="muted">Losses: ${s.Losses ?? 0}</span>${tag}</div>`
      }).join('') || '<div class="muted">No entrants yet.</div>';
    }

    async function refresh(){
      try{
        setOnline(true);
        const [races, standings] = await Promise.all([fetchGviz(SHEETS.races), fetchGviz(SHEETS.standings)]);
        if (roundSel.options.length<=1) renderRoundsSelector(races);
        renderHeats(races);
        renderStandings(standings);
        lastSync.textContent = 'Updated ' + new Date().toLocaleTimeString();
      }catch(e){
        console.error(e); setOnline(false); lastSync.textContent = 'Update failed';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    [roundSel, bracketSel, standingFilter].forEach(el=> el.addEventListener('change', refresh));

    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
